[package]
name        = "fridge"
version     = "0.1.0"
edition     = "2021"
description = "Ergonomic builder/handler wrapper over the official `frida` crate — point it at a process, hand it a script, get message callbacks back."
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/jhasheng/fridge"
homepage    = "https://github.com/jhasheng/fridge"
keywords    = ["frida", "instrumentation", "hooking", "reverse-engineering"]
categories  = ["development-tools", "api-bindings"]
readme      = "README.md"

[lib]
name = "fridge"
path = "src/lib.rs"

[features]
default = ["auto-download"]
# Pulls frida-core devkit during build so the consumer doesn't need a local
# install. Turn off if you already have devkit on rustc-link-search.
auto-download = ["frida/auto-download"]

[dependencies]
# Pulled directly from the jhasheng/frida-rust fork. That fork carries:
#   1. The fix for frida-rust#189 (ScriptHandler user_data UB).
#   2. Session::compile_script + Session::create_script_from_bytes.
# Consumers therefore do NOT need a [patch.crates-io] entry of their own —
# fridge resolves frida transitively to the fork already.
frida = { git = "https://github.com/jhasheng/frida-rust.git", rev = "6a92b72", default-features = false }

# Error plumbing
thiserror = "1"

# Event / LogLevel derive Serialize so downstream IPC layers
# (tauri-plugin-fridge etc.) can hand them straight to emit / JSON
# without re-mapping.
serde = { version = "1", features = ["derive"] }

# Re-exported so consumers can read `Event::Send.payload` without pulling
# serde_json themselves.
serde_json = "1"

[dev-dependencies]
# `inspect` example
anyhow = "1"

[[example]]
name = "inspect"
path = "examples/inspect.rs"

[[example]]
name = "raw_field"
path = "examples/raw_field.rs"

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true

