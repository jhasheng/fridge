[package]
name        = "fridge"
version     = "0.1.0"
edition     = "2021"
description = "Ergonomic builder/handler wrapper over the official `frida` crate — point it at a process, hand it a script, get message callbacks back."
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/jhasheng/fridge"
homepage    = "https://github.com/jhasheng/fridge"
keywords    = ["frida", "instrumentation", "hooking", "reverse-engineering"]
categories  = ["development-tools", "api-bindings"]
readme      = "README.md"

[lib]
name = "fridge"
path = "src/lib.rs"

[features]
default = ["auto-download", "record"]
# Pulls frida-core devkit during build so the consumer doesn't need a local
# install. Turn off if you already have devkit on rustc-link-search.
auto-download = ["frida/auto-download"]
# Length-framed bincode capture recorder (Writer<M> / read_all<M>).
# Default-on for zero-config UX; off-by-default consumers (e.g. tauri
# plugin layers that only forward events) can drop bincode by disabling.
record = ["dep:bincode", "dep:chrono"]
# The `fridge` binary (src/bin/fridge.rs) — attach + replay subcommands
# over the library API. Off by default so pure-library users don't drag
# in clap + ctrlc. Enable with `cargo install fridge --features cli` or
# `cargo run --features cli -- attach ...`.
cli = ["dep:clap", "dep:ctrlc", "record"]

[dependencies]
# Pulled directly from the jhasheng/frida-rust fork's `dev` branch. That fork carries:
#   1. The fix for frida-rust#189 (ScriptHandler user_data UB).
#   2. Session::compile_script + Session::create_script_from_bytes.
#   3. Scope::Full + Process::get_parameters (used by Target::MainByName).
# Consumers therefore do NOT need a [patch.crates-io] entry of their own —
# fridge resolves frida transitively to the fork already.
frida = { git = "https://github.com/jhasheng/frida-rust.git", branch = "dev", default-features = false }

# Error plumbing
thiserror = "1"

# Event / LogLevel derive Serialize so downstream IPC layers
# (tauri-plugin-fridge etc.) can hand them straight to emit / JSON
# without re-mapping.
serde = { version = "1", features = ["derive"] }

# Re-exported so consumers can read `Event::Send.payload` without pulling
# serde_json themselves.
serde_json = "1"

# Length-framed capture format under the `record` feature. v2 uses the
# `bincode::serde` adapter so consumer message types only need serde
# derives, not bincode-native Encode/Decode.
bincode = { version = "2", features = ["serde"], optional = true }

# Local-tz timestamps for `timestamped_path` filenames under `record`.
# default-features off keeps it minimal — only `clock` is needed.
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }

# Argument parser for the `fridge` binary under the `cli` feature.
clap = { version = "4", features = ["derive"], optional = true }

# Ctrl+C handling for `fridge attach` — let the user stop the capture
# without killing the process and losing the in-flight recording flush.
# `termination` feature also catches SIGTERM (Unix) and Ctrl+Break
# (Windows) — important so a containerized `fridge` recorder cleanly
# flushes when its orchestrator stops it.
ctrlc = { version = "3", features = ["termination"], optional = true }

[dev-dependencies]
# `inspect` example
anyhow = "1"
# Round-trip tests for the record module use isolated temp dirs.
tempfile = "3"

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "inspect"
path = "examples/inspect.rs"

[[example]]
name = "raw_field"
path = "examples/raw_field.rs"

[[bin]]
name = "fridge"
path = "src/bin/fridge.rs"
# Cargo would otherwise auto-build the bin on every `cargo build`, dragging
# in clap + ctrlc for library-only users. required-features makes it a no-op
# unless `--features cli` is on.
required-features = ["cli"]

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true

